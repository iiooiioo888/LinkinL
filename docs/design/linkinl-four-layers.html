<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkinL 設計深連結 — 導向互動首頁</title>
  <meta http-equiv="refresh" content="0; url=../../index.html" />
  <link rel="canonical" href="https://iiooiioo888.github.io/LinkinL/" />
  <style>
    :root { --canvas: #07080a; --ink: #ececee; --sub: #8b8b96; --lime: #c6ff3d; --bd: #25262c; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--canvas);
      color: var(--ink);
      font-family: 'Noto Sans TC', 'PingFang TC', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }
    main { max-width: 36rem; border: 1px solid var(--bd); padding: 24px; }
    a { color: var(--lime); }
    code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--sub); }
    p { color: var(--sub); }
  </style>
  <script>
    (function () {
      var map = {
        '#hero': '#x00-hero',
        '#pain': '#x01-pain',
        '#product': '#x02-product',
        '#engine': '#x03-engine',
        '#engine-budget': '#x03-budget',
        '#engine-consensus': '#x03-consensus',
        '#tool-sim': '#x03-tool-sim',
        '#evidence': '#x04-evidence',
        '#integrations': '#x05-integrations',
        '#ui-atlas': '#x05-ui-atlas',
        '#compare': '#x06-compare',
        '#trust': '#x07-trust',
        '#voices': '#x08-voices',
        '#pricing': '#x09-pricing',
        '#faq': '#x0a-faq'
      };
      var hash = map[location.hash] || location.hash || '#x00-hero';
      var target = '../../index.html' + hash;
      var canon = document.querySelector('link[rel="canonical"]');
      if (canon) canon.href = 'https://iiooiioo888.github.io/LinkinL/' + hash;
      var meta = document.querySelector('meta[http-equiv="refresh"]');
      if (meta) meta.setAttribute('content', '0; url=' + target);
      location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <h1 style="font-size:1.15rem;font-weight:600;margin:0 0 12px;">設計深連結已對齊互動首頁</h1>
    <p>此路徑不再維護第二份行銷 HTML。完整排版、工具動畫與 <code>xNN</code> 錨點以首頁為準。</p>
    <p><a id="go" href="../../index.html#x00-hero">前往互動首頁</a></p>
    <p>常用：<a href="../../index.html#x0b-layers">#x0b-layers</a> · <a href="../../index.html#x0c-install">#x0c-install</a> · <a href="../../index.html#x03-tool-sim">#x03-tool-sim</a></p>
  </main>
  <script>
    document.getElementById('go').href = '../../index.html' + (location.hash || '#x00-hero');
  </script>
</body>
</html>

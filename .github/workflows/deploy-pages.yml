name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 佇列中的舊部署若晚於新 push 完成，會把 Pages 蓋回舊版。新 push 取消尚未開始的舊部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site (Vite + React)
        working-directory: site
        run: npm ci && npm run build

      - name: Prepare static site
        run: |
          touch site/dist/.nojekyll
          SHORT="${GITHUB_SHA::7}"
          cat > site/dist/version.json <<EOF
          {
            "build": "${GITHUB_SHA}",
            "short": "${SHORT}",
            "railNodes": 6,
            "deployedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "stack": "vite-react"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
